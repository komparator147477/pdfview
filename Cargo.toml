[package]
name = "pdfview"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal PDF viewer and editor for scanned document cleanup"
repository = "https://github.com/komparator147477/pdfview"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
shell-words = "1.1"
tempfile = "3.13"
serde_json = "1.0"
